# PowerSync sync stream rules for the tee-time PoC.
# Paste into your PowerSync dashboard → Sync Rules.

config:
  edition: 3

streams:
  # Every list owned by the authenticated user.
  lists:
    query: |
      SELECT *
      FROM lists
      WHERE owner_id = request.user_id()
    auto_subscribe: true

  # All todos belonging to the user's lists.
  todos:
    query: |
      SELECT todos.*
      FROM todos
      JOIN lists ON lists.id = todos.list_id
      WHERE lists.owner_id = request.user_id()
    auto_subscribe: true
