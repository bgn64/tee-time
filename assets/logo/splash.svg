<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tee Time splash · 2c sunset disc on cream with the wordmark below. -->
  <defs>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f8d4a0"/>
      <stop offset="38%"  stop-color="#f4b27a"/>
      <stop offset="58%"  stop-color="#a8c97b"/>
      <stop offset="100%" stop-color="#2f7d4b"/>
    </linearGradient>
    <clipPath id="discClip"><circle cx="512" cy="448" r="220"/></clipPath>
  </defs>

  <!-- Cream backdrop -->
  <rect width="1024" height="1024" fill="#f6f7f2"/>

  <!-- Sunset disc, centered horizontally and slightly above vertical center
       to leave room for the wordmark below. Inner artwork is scaled and
       translated from the 1024-canvas source coordinates so it inscribes
       cleanly inside the disc. -->
  <g transform="translate(292.16, 228.16) scale(0.44)">
    <circle cx="512" cy="512" r="500" fill="url(#sunsetGrad)"/>
  </g>
  <g clip-path="url(#discClip)" transform="translate(292.16, 228.16) scale(0.44)">
    <circle cx="720" cy="370" r="78" fill="#ffeacb" opacity=".85"/>
    <circle cx="720" cy="370" r="50" fill="#fff3da" opacity=".95"/>
    <path d="M126 644 C246 526 382 526 512 634 C642 742 782 728 900 606"
          fill="none" stroke="#2f7d4b" stroke-width="92" stroke-linecap="round"/>
    <path d="M136 718 C274 626 412 632 544 720 C672 804 794 798 900 706"
          fill="none" stroke="#14543a" stroke-width="36" stroke-linecap="round"/>
    <path d="M182 654 C304 590 420 602 534 676 C646 748 758 746 852 672"
          fill="none" stroke="#f6f7f2" stroke-width="20" stroke-linecap="round" opacity=".85"/>
    <ellipse cx="368" cy="564" rx="36" ry="10" fill="#123322" opacity=".5"/>
    <ellipse cx="368" cy="562" rx="24" ry="5.5" fill="#0b1f15" opacity=".72"/>
    <path d="M368 324 C365 410 365 492 368 562"
          fill="none" stroke="#123322" stroke-width="14" stroke-linecap="round"/>
    <path d="M368 326 C416 308 456 328 500 310 L500 380 C450 402 416 382 371 398 C368 370 367 346 368 326 Z"
          fill="#d94835"/>
    <path d="M388 341 C418 337 446 347 480 336 L480 366 C449 376 420 368 389 378 Z"
          fill="#f97066" opacity=".5"/>
  </g>
  <!-- Disc outline ring (also scaled) -->
  <circle cx="512" cy="448" r="220" fill="none" stroke="#0e3a26" stroke-width="4.4"/>

  <!-- Wordmark · italic serif, primaryDark green -->
  <text x="512" y="790"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-style="italic" font-weight="500"
        font-size="90" text-anchor="middle" fill="#14543a"
        letter-spacing="-1">tee time</text>
</svg>
