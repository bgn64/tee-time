<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scorecard · Hole-number affordance styling</title>
<!--
  Exploration for option #6: how to style the scorecard hole numbers so they
  read as TAPPABLE (each hole opens a per-hole detail sheet), without making
  the dense grid noisy.

  To isolate the variable, every demo below uses:
    - the SAME front-nine data (Pebble Beach, card A)
    - the SAME selected-state: hole 4 highlighted down the whole column
  …and changes ONLY the hole-number affordance. The caption (option #5) is
  shown in context under each block.

  Tokens mirror src/library/theme/themes.ts.
-->
<style>
  :root, [data-theme="light"] {
    --bg:#f6f7f2; --primary:#2f7d4b; --primary-dark:#14543a; --accent:#d94835;
    --text-title:#123322; --text-body:#39423d; --text-muted:#718077;
    --card-bg:#ffffff; --chip-bg:#edf1e9; --border:#dce2d8; --hairline:#ebeee6;
    --tee-blue:#4b8fd1; --shadow-card:0 10px 14px rgba(20,84,58,.10); --page-text:#2b332e;
  }
  [data-theme="dark"] {
    --bg:#0f1419; --primary:#91d45f; --primary-dark:#66b34e; --accent:#f97066;
    --text-title:#edf5e8; --text-body:#cbd6cf; --text-muted:#91a095;
    --card-bg:#18222b; --chip-bg:#24313a; --border:#34424b; --hairline:rgba(255,255,255,.06);
    --tee-blue:#6aa9e5; --shadow-card:0 10px 16px rgba(0,0,0,.45); --page-text:#cdd6cf;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:26px 16px 80px; background:var(--bg); color:var(--page-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .2s,color .2s;
  }
  .page-head { max-width:760px; margin:0 auto 6px; }
  .page-head h1 { font-size:20px; margin:0 0 6px; color:var(--text-title); letter-spacing:-.3px; }
  .page-head p { font-size:13px; line-height:1.55; margin:0; color:var(--text-muted); max-width:640px; }
  .toolbar { max-width:760px; margin:14px auto 0; display:flex; gap:10px; align-items:center; }
  .btn { font:inherit; font-size:12.5px; font-weight:700; border:1px solid var(--border);
    background:var(--card-bg); color:var(--text-title); padding:8px 13px; border-radius:9px; cursor:pointer; }
  .btn[aria-pressed="true"] { background:var(--primary); color:#fff; border-color:var(--primary); }

  .grid { max-width:920px; margin:26px auto 0; display:flex; flex-wrap:wrap; gap:22px; }

  .demo { width:410px; max-width:100%; }
  .demo h2 { font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 4px; }
  .demo .blurb { font-size:11.5px; color:var(--text-muted); margin:0 0 10px; line-height:1.5; min-height:32px; }

  .card { background:var(--card-bg); box-shadow:var(--shadow-card); border-radius:8px; padding:12px 10px 10px; }

  /* ---- Scorecard grid (mirrors HorizontalScorecard) ---- */
  .sc-row { display:grid; grid-template-columns:42px repeat(9, minmax(0,1fr)) 30px 36px; align-items:center; }
  .sc-cell { text-align:center; font-size:11px; padding:3px 0; min-width:0; position:relative; }
  .sc-label { display:flex; align-items:center; gap:5px; padding-left:2px; text-align:left;
    font-size:9.5px; font-weight:900; letter-spacing:.3px; color:var(--text-muted); }
  .sc-head { border-bottom:1.5px solid var(--text-title); padding-bottom:2px; }
  .sc-head .sc-cell { font-weight:900; color:var(--text-title); font-size:10.5px; }
  .sc-par .sc-cell { font-size:12px; font-weight:800; color:var(--text-title); }
  .sc-hcp .sc-cell { font-size:9px; font-weight:700; color:var(--text-muted); }
  .sc-scorer { border-top:1px solid var(--hairline); }
  .sc-scorer .sc-label { font-weight:800; color:var(--text-title); font-size:11px; }
  .sc-scorer .sc-cell { padding:5px 0; }
  .col-out,.col-tot { background:var(--chip-bg); font-weight:900; font-size:10.5px; color:var(--text-title); }

  .avatar.xs { width:17px; height:17px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; color:#fff; font-weight:800; font-size:8px; }

  .mark { width:20px; height:20px; margin:0 auto; position:relative; display:flex; align-items:center;
    justify-content:center; font-weight:900; font-size:11px; color:var(--text-title); }
  .mark.circle { border:1.5px solid var(--text-title); border-radius:50%; }
  .mark.square { border:1.5px solid var(--text-title); border-radius:4px; }

  /* ---- Selected-state: hole-4 column tint (identical in every demo) ---- */
  .col-active { background:color-mix(in srgb, var(--primary) 12%, transparent); }
  .sc-head .col-active { background:color-mix(in srgb, var(--primary) 18%, transparent);
    border-top-left-radius:6px; border-top-right-radius:6px; }
  .sc-scorer:last-child .col-active { border-bottom-left-radius:6px; border-bottom-right-radius:6px; }
  .col-active.is-num { color:var(--primary-dark); }
  [data-theme="dark"] .col-active.is-num { color:var(--primary); }

  .caption { margin:8px 2px 0; font-size:10.5px; font-weight:600; color:var(--text-muted);
    display:flex; align-items:center; gap:5px; }
  .caption svg { width:12px; height:12px; stroke:var(--text-muted); fill:none; stroke-width:1.8; }

  /* =======================================================================
     AFFORDANCE VARIANTS — only the HOLE-number header cells differ
     ======================================================================= */

  /* Baseline: plain static numbers (today) */

  /* A · Chip: each number in a soft rounded chip */
  .v-chip .sc-head .sc-num {
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:18px;
    padding:0 5px; border-radius:999px; background:var(--chip-bg); color:var(--text-title);
  }
  .v-chip .sc-head .col-active .sc-num { background:var(--primary); color:#fff; }

  /* B · Link: dotted underline, link-like */
  .v-link .sc-head .sc-num {
    color:var(--primary-dark); border-bottom:1.5px dotted var(--primary); padding-bottom:1px;
  }
  [data-theme="dark"] .v-link .sc-head .sc-num { color:var(--primary); }
  .v-link .sc-head .col-active .sc-num { border-bottom-style:solid; }

  /* C · Bordered: each number in a hairline button box */
  .v-box .sc-head .sc-num {
    display:inline-flex; align-items:center; justify-content:center; min-width:21px; height:19px;
    border:1px solid var(--border); border-radius:5px; color:var(--text-title);
  }
  .v-box .sc-head .col-active .sc-num { border-color:var(--primary); color:var(--primary-dark); }
  [data-theme="dark"] .v-box .sc-head .col-active .sc-num { color:var(--primary); }

  /* D · Header strip: whole HOLE row reads as one tappable band */
  .v-strip .sc-head { background:var(--chip-bg); border-radius:7px; border-bottom:none;
    margin-bottom:2px; padding:2px 0; }
  .v-strip .sc-head .sc-cell { color:var(--text-title); }
  .v-strip .sc-head .sc-label { color:var(--text-muted); }
  .v-strip .sc-head .col-active .sc-num { color:#fff; background:var(--primary);
    border-radius:999px; padding:1px 6px; }
</style>
</head>
<body data-theme="light">

  <div class="page-head">
    <h1>Hole-number affordance — styling options</h1>
    <p>
      Same data, same selected state (hole&nbsp;4 highlighted down the column). Only the
      <strong>hole-number treatment</strong> changes, so you can compare how strongly each one signals
      &ldquo;tap me&rdquo; against how much it clutters the grid. Caption (option&nbsp;#5) shown in context.
    </p>
  </div>

  <div class="toolbar">
    <button class="btn" id="themeBtn" aria-pressed="false">🌙 Dark theme</button>
  </div>

  <div class="grid" id="grid"></div>

<script>
(function () {
  "use strict";

  // --- Front-nine data (Pebble Beach front, card A) ---
  var holes = [1,2,3,4,5,6,7,8,9];
  var par   = [4,5,4,4,3,5,3,4,4];
  var hcp   = [8,10,12,6,16,4,18,2,14];
  var ben   = [{s:4},{s:4,m:"circle"},{s:4},{s:3,m:"circle"},{s:3},{s:6,m:"square"},{s:2,m:"circle"},{s:5,m:"square"},{s:4}];
  var mira  = [{s:5,m:"square"},{s:6,m:"square"},{s:5,m:"square"},{s:4},{s:3},{s:6,m:"square"},{s:3},{s:4},{s:5,m:"square"}];
  var ACTIVE = 4; // hole 4 selected

  function cell(content, extra) {
    return '<div class="sc-cell ' + (extra||'') + '">' + content + '</div>';
  }
  function activeOf(holeNum, isNum) {
    return holeNum === ACTIVE ? ('col-active' + (isNum ? ' is-num' : '')) : '';
  }

  function headRow() {
    var s = '<div class="sc-row sc-head"><div class="sc-cell sc-label">HOLE</div>';
    holes.forEach(function (h) {
      s += cell('<span class="sc-num">' + h + '</span>', activeOf(h, true));
    });
    s += '<div class="sc-cell col-out">OUT</div><div class="sc-cell"></div></div>';
    return s;
  }
  function metaRow(cls, label, arr) {
    var s = '<div class="sc-row ' + cls + '"><div class="sc-cell sc-label">' + label + '</div>';
    arr.forEach(function (v, i) { s += cell(v, activeOf(holes[i])); });
    s += '<div class="sc-cell col-out">' + (cls === 'sc-par' ? '36' : '') + '</div><div class="sc-cell"></div></div>';
    return s;
  }
  function scorerRow(name, color, arr, out) {
    var s = '<div class="sc-row sc-scorer"><div class="sc-cell sc-label">' +
            '<span class="avatar xs" style="background:' + color + '">' + name[0] + '</span>' + name + '</div>';
    arr.forEach(function (d, i) {
      var mk = '<span class="mark ' + (d.m||'') + '">' + d.s + '</span>';
      s += cell(mk, activeOf(holes[i]));
    });
    s += '<div class="sc-cell col-out">' + out + '</div><div class="sc-cell"></div></div>';
    return s;
  }

  function scorecard(variantClass) {
    return '<div class="card ' + variantClass + '">' +
      headRow() +
      metaRow('sc-par','PAR',par) +
      metaRow('sc-hcp','HCP',hcp) +
      scorerRow('Ben','#4a6f3a',ben,'−1') +
      scorerRow('Mira','#c93b7a',mira,'+5') +
      '</div>' +
      '<div class="caption">' +
        '<svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M3 12a9 9 0 1018 0 9 9 0 00-18 0"/></svg>' +
        'Tap a hole for shot-by-shot</div>';
  }

  var demos = [
    { cls:'',        title:'Baseline (today)', blurb:'Static numbers. Zero clutter, but gives no hint the holes are tappable.' },
    { cls:'v-chip',  title:'A · Chip',         blurb:'Each number in a soft pill. Clearly tappable; adds mild weight to the row.' },
    { cls:'v-link',  title:'B · Link',         blurb:'Dotted underline, link-like. Very light touch; reads as interactive text.' },
    { cls:'v-box',   title:'C · Bordered',     blurb:'Hairline button box per number. Most button-like, but adds grid-like lines.' },
    { cls:'v-strip', title:'D · Header strip', blurb:'Whole HOLE row is one tappable band; active hole becomes a pill. Low per-cell noise.' }
  ];

  var grid = document.getElementById('grid');
  grid.innerHTML = demos.map(function (d) {
    return '<div class="demo"><h2>' + d.title + '</h2><p class="blurb">' + d.blurb + '</p>' +
           scorecard(d.cls) + '</div>';
  }).join('');

  // Theme toggle
  var body = document.body, themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function () {
    var dark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.setAttribute('aria-pressed', String(!dark));
    themeBtn.textContent = dark ? '🌙 Dark theme' : '☀️ Light theme';
  });
})();
</script>
</body>
</html>
