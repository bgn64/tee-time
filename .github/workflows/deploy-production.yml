name: Deploy to production

# Production deploy with path filtering: deploy Supabase migrations only when
# supabase/migrations/** changed. workflow_dispatch forces a run.
#
# Vercel handles the web-app build independently from this workflow on the
# same push.
#
# Required GitHub configuration on bgn64/tee-time:
#
#   Repository-level secrets:
#     - SUPABASE_ACCESS_TOKEN          Personal access token for the Supabase CLI
#
#   Production environment (Settings -> Environments -> production):
#     Secrets:
#       - DB_PASSWORD                  Production Supabase Postgres password
#     Variables:
#       - PROJECT_ID                   Production Supabase project ref (e.g. bamdgmmhwcancdpppbzr)
#
#   The production environment can also be configured with Required
#   reviewers; the deploy job will then pause for manual approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------
  # changes - fast path-filter probe; output feeds the deploy job if:
  # ------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'supabase/migrations/**'

  # ------------------------------------------------------------
  # deploy-db - Supabase migrations + pre-deploy backup
  # ------------------------------------------------------------
  deploy-db:
    name: Deploy Supabase migrations
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to production Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations
        run: supabase migration list --linked

      # Pre-push backup so we always have a 30-day rollback point.
      - name: Dump production database
        run: |
          mkdir -p backup
          supabase db dump --linked --data-only -f backup/data.sql || true
          supabase db dump --linked -f backup/schema.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-backup-${{ github.sha }}
          path: backup/
          retention-days: 30

      - name: Push migrations
        run: supabase db push --linked