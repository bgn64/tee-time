# PowerSync sync stream rules for the tee-time PoC.
# Edited locally; deployed via `powersync deploy sync-config`.

config:
  edition: 3

streams:
  # Every scorecard (header row) owned by the authenticated user.
  scorecards:
    query: |
      SELECT *
      FROM scorecards
      WHERE owner_user_id = auth.user_id()
    auto_subscribe: true

  # Per-cell scores. owner_user_id is denormalized on each row by the
  # BEFORE INSERT/UPDATE trigger in supabase/migrations/002_scorecards.sql,
  # so no join against scorecards is needed here.
  scorecard_scores:
    query: |
      SELECT *
      FROM scorecard_scores
      WHERE owner_user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Friending streams (added with migration 003_friends.sql).
  #
  # PowerSync requires a single-column `id` per row. The `profiles`
  # table is keyed on `user_id`, so the three profile streams below
  # explicitly alias `user_id AS id` and enumerate the synced columns.
  # PowerSync dedups across streams when multiple select the same
  # source row, so own_profile + friend_profiles + requester_profiles
  # can overlap safely.
  #
  # All writes still flow through the SECURITY DEFINER RPCs in
  # 003_friends.sql; PowerSync handles read replication only.
  # ---------------------------------------------------------------

  # The signed-in user's own profile row.
  own_profile:
    query: |
      SELECT
        user_id AS id, handle, display_name, avatar_color,
        created_at, updated_at
      FROM profiles
      WHERE user_id = auth.user_id()
    auto_subscribe: true

  # Profiles of users the signed-in user is friends with. Joined
  # through `friendships` because PowerSync's JOIN ON clauses only
  # support simple equality.
  friend_profiles:
    query: |
      SELECT
        profiles.user_id AS id,
        profiles.handle,
        profiles.display_name,
        profiles.avatar_color,
        profiles.created_at,
        profiles.updated_at
      FROM profiles
      JOIN friendships ON friendships.friend_user_id = profiles.user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  # Profiles of users with a pending friend request to / from the
  # signed-in user. Two IN-subquery branches because PowerSync JOIN
  # ON clauses don't accept `IN (a, b)` membership predicates.
  requester_profiles:
    query: |
      SELECT
        user_id AS id, handle, display_name, avatar_color,
        created_at, updated_at
      FROM profiles
      WHERE user_id IN (
        SELECT from_user_id FROM friend_requests
        WHERE to_user_id = auth.user_id() AND status = 'pending'
      )
      OR user_id IN (
        SELECT to_user_id FROM friend_requests
        WHERE from_user_id = auth.user_id() AND status = 'pending'
      )
    auto_subscribe: true

  # Half-edges (me, friend). The other side syncs to the friend's
  # device via their own subscription; the client only ever reads its
  # own half-edges so syncing both halves would just double the
  # local row count.
  friendships:
    query: |
      SELECT *
      FROM friendships
      WHERE user_id = auth.user_id()
    auto_subscribe: true

  # Pending friend requests either direction. Declined / accepted /
  # expired rows aren't needed locally.
  friend_requests:
    query: |
      SELECT *
      FROM friend_requests
      WHERE (from_user_id = auth.user_id() OR to_user_id = auth.user_id())
        AND status = 'pending'
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Custom players (added with migration 004_custom_players.sql).
  #
  # User-scoped roster of off-app people the user plays rounds with.
  # Syncs ALL of the user's rows including soft-deleted ones so the
  # scorecard participant resolver keeps rendering them correctly
  # after a delete. The player picker filters
  # `WHERE deleted_at IS NULL` locally.
  # ---------------------------------------------------------------

  custom_players:
    query: |
      SELECT *
      FROM custom_players
      WHERE owner_user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Friend feed streams (added with milestone "Feed tab + live rounds").
  #
  # Sync scorecards (header rows) + scorecard_scores (per-cell rows)
  # owned by any user the signed-in user is friends with. Together
  # with the existing scorecards / scorecard_scores streams (which
  # scope to own rows), this makes every row needed for the Feed tab
  # available in local SQLite — no Supabase REST calls on the read
  # path.
  #
  # The JOIN-on-equality pattern matches `friend_profiles` above; no
  # WHERE clause on friendships is needed because the friendships
  # sync rule already scopes the table to the signed-in user.
  #
  # Unfriending automatically drops the synced friend rows on the
  # next sync tick because the JOIN no longer matches. The feed
  # query also filters via a local `friendships` join so stale
  # local rows don't blink visible during the sync gap.
  #
  # PowerSync dedups across streams; the user's own rows are NOT
  # double-synced even though both `scorecards` and `friend_*`
  # streams could in principle match if friendships ever included
  # a self-edge (it doesn't — RPC forbids self-friending).
  # ---------------------------------------------------------------

  friend_scorecards:
    query: |
      SELECT scorecards.*
      FROM scorecards
      JOIN friendships ON friendships.friend_user_id = scorecards.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  friend_scorecard_scores:
    query: |
      SELECT scorecard_scores.*
      FROM scorecard_scores
      JOIN friendships ON friendships.friend_user_id = scorecard_scores.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Round comments (added with migration 007_round_comments.sql).
  #
  # One stream per visibility scope (own rounds, friend rounds),
  # mirroring the scorecards / friend_scorecards split. JOINs use
  # single-equality matches only — PowerSync rejects more complex
  # JOIN ON predicates.
  #
  # Tombstoned rows (`deleted_at IS NOT NULL`) sync down too;
  # the UI filters them client-side. That keeps the soft-delete
  # behaviour consistent across devices (the row's PK stays
  # synced — disappearing it from the stream would look like a
  # hard delete to other viewers, and other viewers' local caches
  # would still hold the old version until the next full sync).
  #
  # PowerSync dedups across streams; if the user's own round has a
  # comment they authored, it appears once locally even though both
  # streams would match.
  # ---------------------------------------------------------------

  own_round_comments:
    query: |
      SELECT comments.*
      FROM comments
      JOIN scorecards ON scorecards.id = comments.round_id
      WHERE scorecards.owner_user_id = auth.user_id()
    auto_subscribe: true

  friend_round_comments:
    query: |
      SELECT comments.*
      FROM comments
      JOIN scorecards ON scorecards.id = comments.round_id
      JOIN friendships ON friendships.friend_user_id = scorecards.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Round likes (added with migration 013_round_likes.sql).
  #
  # Mirrors the comments pair above — one stream for likes on the
  # user's own rounds, one for likes on friend rounds. PowerSync
  # dedups across streams; a like the user authored on their own
  # round appears once locally even though both streams could
  # match.
  #
  # The denormalized `owner_user_id` on each row means we *could*
  # scope by `owner_user_id = auth.user_id()` without the JOIN,
  # but the JOIN keeps the pattern identical to comments and makes
  # the policy easier to reason about (visibility = "see the
  # parent round").
  # ---------------------------------------------------------------

  own_round_likes:
    query: |
      SELECT round_likes.*
      FROM round_likes
      JOIN scorecards ON scorecards.id = round_likes.round_id
      WHERE scorecards.owner_user_id = auth.user_id()
    auto_subscribe: true

  friend_round_likes:
    query: |
      SELECT round_likes.*
      FROM round_likes
      JOIN scorecards ON scorecards.id = round_likes.round_id
      JOIN friendships ON friendships.friend_user_id = scorecards.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Achievement tags (added with migration 010_achievement_tags.sql).
  #
  # Mirrors the scorecard_scores / friend_scorecard_scores pair —
  # one stream for tags on the user's own scorecards, one for tags
  # on friend scorecards. The denormalized `owner_user_id` on each
  # row scopes the streams without a JOIN.
  #
  # The `tags` column is jsonb on the server, TEXT in local
  # PowerSync SQLite, and re-parsed at the upload boundary by
  # SupabaseConnector's JSON_COLUMNS_BY_TABLE map.
  # ---------------------------------------------------------------

  scorecard_achievement_tags:
    query: |
      SELECT *
      FROM scorecard_achievement_tags
      WHERE owner_user_id = auth.user_id()
    auto_subscribe: true

  friend_scorecard_achievement_tags:
    query: |
      SELECT scorecard_achievement_tags.*
      FROM scorecard_achievement_tags
      JOIN friendships ON friendships.friend_user_id = scorecard_achievement_tags.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true

  # ---------------------------------------------------------------
  # Tracked-stats overrides (added with migration 011).
  #
  # Same own + friend pair pattern as achievement tags. Friends
  # need read access so they compute aggregates using the same
  # enabled-tag set the owner picked.
  # ---------------------------------------------------------------

  scorecard_tracked_stats:
    query: |
      SELECT *
      FROM scorecard_tracked_stats
      WHERE owner_user_id = auth.user_id()
    auto_subscribe: true

  friend_scorecard_tracked_stats:
    query: |
      SELECT scorecard_tracked_stats.*
      FROM scorecard_tracked_stats
      JOIN friendships ON friendships.friend_user_id = scorecard_tracked_stats.owner_user_id
      WHERE friendships.user_id = auth.user_id()
    auto_subscribe: true
